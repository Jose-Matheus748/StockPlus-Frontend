<div class="flex h-screen bg-gray-50 text-gray-900 font-sans">

  <!-- SIDEBAR -->
  <aside
    [ngClass]="sidebarOpen ? 'w-64' : 'w-16'"
    class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300 shadow-sm">

    <!-- LOGO / BRAND -->
    <div class="flex items-center gap-3 px-4 py-5 border-b border-gray-100">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <span *ngIf="sidebarOpen" class="text-base font-semibold text-gray-900 tracking-tight">StockPlus</span>
    </div>

    <!-- NAV -->
    <nav class="flex-1 px-2 py-4 space-y-1">

      <a
        routerLink="/estoques"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors group"
        [title]="sidebarOpen ? '' : 'Estoques'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Estoques</span>
      </a>

      <a
        routerLink="/produtos"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Produtos'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Produtos</span>
      </a>

      <a
        routerLink="/protocolos"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Protocolos'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Protocolos</span>
      </a>

    </nav>

    <!-- USER / FOOTER -->
    <div class="px-2 py-4 border-t border-gray-100">

      <div *ngIf="sidebarOpen" class="flex items-center gap-3 px-3 py-2 mb-2">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-semibold flex-shrink-0">
          {{ getNomeInicial() }}
        </div>
        <div class="min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">{{ usuario?.nome }}</p>
          <p class="text-xs text-gray-400 truncate">{{ usuario?.email }}</p>
        </div>
      </div>

      <div *ngIf="!sidebarOpen" class="flex justify-center mb-2">
        <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-semibold">
          {{ getNomeInicial() }}
        </div>
      </div>

      <button
        (click)="handleLogout()"
        class="w-full flex items-center justify-center gap-2 px-3 py-2 text-sm text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span *ngIf="sidebarOpen">Sair</span>
      </button>

    </div>

  </aside>

  <main class="flex-1 flex flex-col overflow-hidden">

    <header class="flex items-center justify-between bg-white border-b border-gray-200 px-6 py-3.5">

      <button
        (click)="toggleSidebar()"
        class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="flex items-center gap-2 text-sm text-gray-500">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        Bem-vindo, <span class="font-medium text-gray-800">{{ usuario?.nome }}</span>
      </div>

    </header>

    <div class="flex-1 overflow-y-auto bg-gray-50">
      <ng-content></ng-content>
    </div>

  </main>

</div>
