<div class="flex h-screen bg-gray-50 text-gray-900 font-sans">

  <!-- SIDEBAR -->
  <aside
    [ngClass]="sidebarOpen ? 'w-56' : 'w-16'"
    class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300 shadow-sm">

    <!-- LOGO -->
    <div class="flex items-center justify-center px-4 py-5 border-b border-gray-100">
      <div class="flex flex-col items-center gap-1">
        <img
          src="StockPluslogoMenor.png"
          alt="StockPlus"
          class="w-8 h-8 object-contain">
        <span *ngIf="sidebarOpen" class="text-sm font-semibold text-gray-900 tracking-tight">StockPlus</span>
      </div>
    </div>

    <!-- NAV -->
    <nav class="flex-1 px-2 py-4 space-y-1">

      <a
        routerLink="/estoques"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Estoques'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Estoques</span>
      </a>

      <a
        routerLink="/produtos"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Produtos'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Produtos</span>
      </a>

      <a
        routerLink="/protocolos"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Protocolos'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Protocolos</span>
      </a>

      <a
        routerLink="/pedidos-loja"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Pedidos Recebidos'">
        <div class="relative flex-shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
          </svg>
          <!-- badge de pendentes -->
          <span
            *ngIf="totalPendentes > 0"
            class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-amber-400 text-white text-[9px] font-bold rounded-full flex items-center justify-center leading-none">
            {{ totalPendentes > 9 ? '9+' : totalPendentes }}
          </span>
        </div>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Pedidos</span>
        <span
          *ngIf="sidebarOpen && totalPendentes > 0"
          class="ml-auto text-xs font-semibold bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">
          {{ totalPendentes }}
        </span>
      </a>

    </nav>

  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="flex items-center justify-between bg-white border-b border-gray-200 px-6 py-3.5">

      <!-- TOGGLE SIDEBAR -->
      <button
        (click)="toggleSidebar()"
        class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- USUARIO + DROPDOWN -->
      <div class="relative">

        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition-colors">

        <app-foto-perfil
          [foto]="getFoto()"
          [tamanho]="28"
          (fotoSelecionada)="salvarFoto($event)">
        </app-foto-perfil>

          <div class="text-left hidden sm:block">
            <p class="text-sm font-medium text-gray-900 leading-none">{{ usuario?.nome }}</p>
            <p class="text-xs text-gray-400 mt-0.5">{{ usuario?.email }}</p>
          </div>

          <svg
            [ngClass]="userMenuOpen ? 'rotate-180' : ''"
            class="transition-transform duration-200 text-gray-400 flex-shrink-0"
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- DROPDOWN -->
        <div
          *ngIf="userMenuOpen"
          class="absolute right-0 mt-1 w-44 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50">

          <div class="px-3 py-2 border-b border-gray-100 sm:hidden">
            <p class="text-sm font-medium text-gray-900">{{ usuario?.nome }}</p>
            <p class="text-xs text-gray-400">{{ usuario?.email }}</p>
          </div>

          <button
            (click)="handleLogout()"
            class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors rounded-lg mx-auto">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
          </button>

        </div>
      </div>

    </header>

    <!-- CONTEÚDO -->
    <div class="flex-1 overflow-y-auto bg-gray-50">
      <ng-content></ng-content>
    </div>

  </main>

  <!-- OVERLAY para fechar dropdown clicando fora -->
  <div
    *ngIf="userMenuOpen"
    class="fixed inset-0 z-40"
    (click)="toggleUserMenu()">
  </div>

</div>
