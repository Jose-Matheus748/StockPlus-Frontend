<div class="flex h-screen bg-gray-50 text-gray-900 font-sans">

  <!-- SIDEBAR -->
  <aside
    [ngClass]="sidebarOpen ? 'w-56' : 'w-16'"
    class="bg-white border-r border-gray-200 flex flex-col transition-all duration-300 shadow-sm">

    <!-- LOGO -->
    <div class="flex items-center justify-center px-4 py-5 border-b border-gray-100">
      <div class="flex flex-col items-center gap-1">
        <img
          src="StockPluslogoMenor.png"
          alt="StockPlus"
          class="w-8 h-8 object-contain">
        <span *ngIf="sidebarOpen" class="text-sm font-semibold text-gray-900 tracking-tight">StockPlus</span>
      </div>
    </div>

    <!-- NAV -->
    <nav class="flex-1 px-2 py-4 space-y-1">

      <a
        routerLink="/lojas"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Lojas'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Lojas</span>
      </a>

      <a
        routerLink="/pedidos"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Meus Pedidos'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="9" y1="16" x2="13" y2="16"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Meus Pedidos</span>
      </a>

      <a
        routerLink="/perfil/cliente"
        routerLinkActive="bg-blue-50 text-blue-600"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-colors"
        [title]="sidebarOpen ? '' : 'Perfil'">
        <svg class="flex-shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span *ngIf="sidebarOpen" class="text-sm font-medium">Perfil</span>
      </a>

    </nav>

  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="flex items-center justify-between bg-white border-b border-gray-200 px-6 py-3.5">

      <!-- TOGGLE SIDEBAR -->
      <button
        (click)="toggleSidebar()"
        class="p-1.5 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-md transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- USUARIO + DROPDOWN -->
      <div class="relative">

        <button
          (click)="toggleUserMenu()"
          class="flex items-center gap-2.5 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition-colors">

          <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-semibold flex-shrink-0">
            {{ getNomeInicial() }}
          </div>

          <div class="text-left hidden sm:block">
            <p class="text-sm font-medium text-gray-900 leading-none">{{ usuario?.nome }}</p>
            <p class="text-xs text-gray-400 mt-0.5">{{ usuario?.email }}</p>
          </div>

          <svg
            [ngClass]="userMenuOpen ? 'rotate-180' : ''"
            class="transition-transform duration-200 text-gray-400 flex-shrink-0"
            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- DROPDOWN -->
        <div
          *ngIf="userMenuOpen"
          class="absolute right-0 mt-1 w-44 bg-white border border-gray-200 rounded-xl shadow-lg py-1 z-50">

          <div class="px-3 py-2 border-b border-gray-100 sm:hidden">
            <p class="text-sm font-medium text-gray-900">{{ usuario?.nome }}</p>
            <p class="text-xs text-gray-400">{{ usuario?.email }}</p>
          </div>

          <button
            (click)="irParaPerfil()"
            class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors rounded-lg">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            Meu Perfil
          </button>

          <div class="mx-2 my-1 border-t border-gray-100"></div>

          <button
            (click)="handleLogout()"
            class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors rounded-lg">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sair
          </button>

        </div>
      </div>

    </header>

    <!-- CONTEÚDO -->
    <div class="flex-1 overflow-y-auto bg-gray-50">
      <ng-content></ng-content>
    </div>

  </main>

  <!-- OVERLAY para fechar dropdown -->
  <div
    *ngIf="userMenuOpen"
    class="fixed inset-0 z-40"
    (click)="toggleUserMenu()">
  </div>

</div>
