<div class="min-h-screen flex items-center justify-center bg-gray-50 text-gray-900 px-4">

  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">

      <div class="w-12 h-12 mx-auto bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold mb-4">
        S
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">
        Criar conta
      </h1>

      <p class="text-sm text-gray-500 mt-2">
        Preencha os dados para começar
      </p>
    </div>

    <form (ngSubmit)="handleSubmit()" class="space-y-4">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Nome</label>
        <input
          [(ngModel)]="nome"
          name="nome"
          placeholder="Seu nome completo"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Email</label>
        <input
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">CPF ou CNPJ</label>
        <input
          [(ngModel)]="cpfOuCnpj"
          name="cpfOuCnpj"
          placeholder="Digite seu documento"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Senha</label>
        <input
          [(ngModel)]="senha"
          name="senha"
          type="password"
          placeholder="Crie uma senha segura"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Confirmar senha</label>
        <input
          [(ngModel)]="confirmarSenha"
          name="confirmarSenha"
          type="password"
          placeholder="Repita sua senha"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div *ngIf="erro"
           class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ erro }}
      </div>

      <div *ngIf="sucesso"
           class="text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2">
        {{ sucesso }}
      </div>

      <button
        type="submit"
        class="w-full flex items-center justify-center bg-blue-600 hover:bg-blue-700
               text-white font-medium text-sm py-2.5 rounded-lg transition-colors">

        Criar conta
      </button>

    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Já tem conta?
      <a [routerLink]="['/login', tipo]"
         class="text-blue-600 hover:text-blue-700 font-medium">
        Fazer login
      </a>
    </p>

  </div>
</div>
