<app-layout-cliente>

  <div class="max-w-6xl mx-auto px-4 py-6">

    <!-- HEADER -->
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-gray-800">Lojas disponíveis</h1>
      <p class="text-sm text-gray-500 mt-1">Selecione uma loja para ver os protocolos e realizar pedidos</p>
    </div>

    <!-- LOADING -->
    <div *ngIf="isLoading" class="text-center py-16 text-gray-400">
      <svg class="animate-spin mx-auto mb-3" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      Carregando lojas...
    </div>

    <!-- ERRO -->
    <div *ngIf="erro && !isLoading"
         class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-6">
      {{ erro }}
    </div>

    <!-- GRID DE LOJAS -->
    <div *ngIf="!isLoading && lojas.length > 0"
         class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

      <div
        *ngFor="let loja of lojas"
        (click)="acessarLoja(loja)"
        class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group">

        <!-- ÍCONE + NOME -->
        <div class="flex items-center gap-3 mb-3">
        
          <!-- Foto de perfil ou ícone padrão -->
          <div class="w-10 h-10 rounded-lg flex-shrink-0 overflow-hidden bg-blue-50 group-hover:bg-blue-100 transition-colors">
            <img
              *ngIf="loja.fotoPerfil"
              [src]="loja.fotoPerfil"
              [alt]="loja.nome"
              class="w-full h-full object-cover">
            <div
              *ngIf="!loja.fotoPerfil"
              class="w-full h-full flex items-center justify-center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
            </div>
          </div>
        
          <div class="min-w-0">
            <h3 class="font-semibold text-gray-900 truncate">{{ loja.nome }}</h3>
            <p class="text-xs text-gray-400 mt-0.5">{{ loja.email }}</p>
          </div>
        </div>

        <!-- DESCRIÇÃO (quando existir) -->
        <p *ngIf="loja.descricao"
           class="text-sm text-gray-500 mb-4 line-clamp-2">
          {{ loja.descricao }}
        </p>

        <p *ngIf="!loja.descricao"
           class="text-sm text-gray-400 italic mb-4">
          Sem descrição disponível
        </p>

        <!-- RODAPÉ DO CARD -->
        <div class="flex items-center justify-between pt-3 border-t border-gray-100">
          <span class="text-xs text-gray-400">Ver protocolos</span>
          <svg class="text-blue-500 group-hover:translate-x-1 transition-transform"
               width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </div>

      </div>
    </div>

    <!-- EMPTY STATE -->
    <div *ngIf="!isLoading && lojas.length === 0"
         class="text-center py-20 text-gray-400">
      <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>
      <p class="text-base font-medium text-gray-500">Nenhuma loja disponível</p>
      <p class="text-sm text-gray-400 mt-1">Volte mais tarde para ver novas lojas.</p>
    </div>

  </div>

</app-layout-cliente>
