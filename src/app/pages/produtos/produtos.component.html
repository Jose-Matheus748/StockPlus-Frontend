<app-layout>
  <app-alerta
    [mensagem]="alertMensagem"
    [tipo]="alertTipo"
    [visivel]="alertVisivel">
  </app-alerta>

  <div class="max-w-6xl mx-auto px-4 py-6">

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Produtos</h1>

      <button
        (click)="abrirFormulario()"
        class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg">
        + Produto
      </button>
    </div>

    <div *ngIf="isLoading" class="text-center py-10 text-gray-500">
      Carregando...
    </div>

    <div *ngIf="erro" class="bg-red-100 text-red-600 p-3 rounded mb-4">
      {{ erro }}
    </div>

    <div *ngIf="!isLoading && produtos.length > 0"
         class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

      <div *ngFor="let produto of produtos"
           class="bg-white p-5 rounded-xl shadow hover:shadow-md transition">

        <h3 class="font-semibold text-lg mb-2">
          {{ produto.nome }}
        </h3>

        <p class="text-sm text-gray-500 mb-3">
          {{ produto.descricao || 'Sem descrição' }}
        </p>

        <div class="text-sm space-y-1 mb-4">
          <p><b>Preço:</b> R$ {{ produto.precoUnitario }}</p>
          <p><b>Qtd:</b> {{ produto.quantidade }}</p>
          <p><b>Fornecedor:</b> {{ produto.fornecedor }}</p>
        </div>

        <div class="flex gap-2">
          <button (click)="abrirFormulario(produto)" class="bg-blue-500 text-white px-3 py-1 rounded">
            Editar
          </button>

          <button (click)="adicionarQuantidade(produto)" class="bg-green-500 text-white px-3 py-1 rounded">
            +
          </button>

          <button (click)="removerQuantidade(produto)" class="bg-yellow-500 text-white px-3 py-1 rounded">
            -
          </button>

          <button (click)="deletarProduto(produto.id)" class="bg-red-500 text-white px-3 py-1 rounded">
            Del
          </button>
        </div>

      </div>
    </div>

    <div *ngIf="!isLoading && produtos.length === 0"
         class="text-center py-10 text-gray-500">
      Nenhum produto encontrado
    </div>

  </div>

  <div *ngIf="showFormModal"
       class="fixed inset-0 bg-black/50 flex items-center justify-center"
       (click)="fecharFormulario()">

    <div class="bg-white p-6 rounded-xl w-full max-w-md"
         (click)="$event.stopPropagation()">

      <h2 class="text-lg font-bold mb-4">
        {{ isEditMode ? 'Editar Produto' : 'Novo Produto' }}
      </h2>

      <div class="space-y-3">

        <label class="text-sm font-medium text-gray-700">Nome do produto</label>
        <input [(ngModel)]="formData.nome" placeholder="Nome"
               class="w-full border p-2 rounded">

        <label class="text-sm font-medium text-gray-700">Fornecedor</label>
        <input [(ngModel)]="formData.fornecedor" placeholder="Fornecedor"
               class="w-full border p-2 rounded">

        <label class="text-sm font-medium text-gray-700">Marca</label>
        <input [(ngModel)]="formData.marca" placeholder="Marca"
               class="w-full border p-2 rounded">

        <label class="text-sm font-medium text-gray-700">Preço</label>
        <input type="number" [(ngModel)]="formData.precoUnitario"
               placeholder="Preço"
               class="w-full border p-2 rounded">

        <label class="text-sm font-medium text-gray-700">Descrição do produto</label>
        <textarea [(ngModel)]="formData.descricao"
                  placeholder="Descrição"
                  class="w-full border p-2 rounded"></textarea>

      </div>

      <div class="flex gap-2 mt-4">
        <button (click)="fecharFormulario()"
                class="flex-1 bg-gray-200 py-2 rounded">
          Cancelar
        </button>

        <button (click)="salvarProduto()"
                class="flex-1 bg-amber-500 text-white py-2 rounded">
          Salvar
        </button>
      </div>

    </div>
  </div>

</app-layout>
