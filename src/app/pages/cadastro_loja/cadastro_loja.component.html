<div class="min-h-screen flex items-center justify-center bg-gray-50 text-gray-900 px-4">

  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

    <!-- HEADER -->
    <div class="text-center mb-8">
      <img src="StockPluslogo.png" alt="StockPlus" class="w-16 h-16 mx-auto mb-4 object-contain">

      <div class="inline-flex items-center gap-2 bg-amber-50 text-amber-700 text-xs font-medium px-3 py-1 rounded-full mb-3">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Cadastrar Loja
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Cadastre sua loja</h1>
      <p class="text-sm text-gray-500 mt-1.5">Preencha os dados para começar a vender</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="handleSubmit()" class="space-y-4">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Nome da loja</label>
        <input
          [(ngModel)]="nome"
          name="nome"
          placeholder="Nome da sua loja"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="loja@email.com"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">CNPJ</label>
        <input
          [(ngModel)]="cnpj"
          name="cnpj"
          placeholder="00.000.000/0000-00"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          placeholder="Crie uma senha segura"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Confirmar senha</label>
        <input
          type="password"
          [(ngModel)]="confirmarSenha"
          name="confirmarSenha"
          placeholder="Repita sua senha"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition"/>
      </div>

      <div *ngIf="erro" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ erro }}
      </div>

      <div *ngIf="sucesso" class="text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2">
        {{ sucesso }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-600
               text-white font-medium text-sm py-2.5 rounded-lg transition-colors disabled:opacity-50">
        <svg *ngIf="isLoading" class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        {{ isLoading ? 'Cadastrando...' : 'Cadastrar loja' }}
      </button>

    </form>

    <!-- FOOTER -->
    <div class="mt-6 space-y-3 text-center text-sm text-gray-500">
      <p>
        Já tem conta?
        <a routerLink="/login/loja" class="text-amber-600 hover:text-amber-700 font-medium">Fazer login</a>
      </p>

      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">é um cliente?</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <p>
        <a routerLink="/cadastro/cliente" class="text-gray-500 hover:text-gray-700 font-medium">← Cadastrar como Cliente</a>
      </p>
    </div>

  </div>
</div>
