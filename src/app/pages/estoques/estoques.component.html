<app-layout>
  <app-alerta [mensagem]="alertMensagem" [tipo]="alertTipo" [visivel]="alertVisivel"></app-alerta>

  <div class="max-w-6xl mx-auto px-6 py-8">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Estoques</h1>
        <p class="text-sm text-gray-500 mt-0.5">Gerencie os estoques da sua empresa</p>
      </div>
      <button (click)="abrirFormulario()"
        class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors shadow-sm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Novo Estoque
      </button>
    </div>

    <!-- LOADING -->
    <div *ngIf="isLoading" class="flex items-center justify-center gap-3 py-24 text-gray-400 text-sm">
      <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      Carregando estoques...
    </div>

    <!-- ERRO -->
    <div *ngIf="erro && !isLoading" class="flex items-center gap-2 bg-red-50 text-red-600 border border-red-200 rounded-lg px-4 py-3 text-sm mb-6">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ erro }}
    </div>

    <!-- GRID -->
    <div *ngIf="!isLoading && estoques.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div *ngFor="let estoque of estoques" class="bg-white border border-gray-200 rounded-xl flex flex-col hover:shadow-md hover:border-gray-300 transition-all duration-200">

        <div class="flex items-center justify-between p-5 pb-3">
          <div class="w-10 h-10 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </div>
          <button (click)="deletarEstoque(estoque)" class="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors" title="Excluir">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
        </div>

        <div class="flex-1 px-5 pb-4">
          <h3 class="text-base font-semibold text-gray-900">{{ estoque.nome }}</h3>
          <p class="text-sm text-gray-500 mt-1 leading-relaxed">{{ estoque.descricao || 'Sem descrição' }}</p>
        </div>

        <div class="px-5 pb-5 pt-1 border-t border-gray-100">
          <button (click)="selecionarEstoque(estoque)" class="w-full inline-flex items-center justify-center gap-2 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg py-2.5 transition-colors">
            Acessar Estoque
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- EMPTY -->
    <div *ngIf="!isLoading && estoques.length === 0" class="flex flex-col items-center text-center py-24 gap-3">
      <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-400 mb-2">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <h3 class="text-base font-semibold text-gray-800">Nenhum estoque cadastrado</h3>
      <p class="text-sm text-gray-500 max-w-xs leading-relaxed">Crie o primeiro estoque para começar a gerenciar seus produtos.</p>
      <button (click)="abrirFormulario()" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition-colors mt-2 shadow-sm">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Criar Primeiro Estoque
      </button>
    </div>
  </div>

  <!-- MODAL -->
  <div *ngIf="showFormModal" class="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 p-4" (click)="fecharFormulario()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="text-base font-semibold text-gray-900">Novo Estoque</h3>
        <button (click)="fecharFormulario()" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="px-6 py-5 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700">Nome <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="novoEstoque.nome" placeholder="Ex: Almoxarifado Central"
            class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-sm font-medium text-gray-700">Descrição</label>
          <textarea [(ngModel)]="novoEstoque.descricao" rows="3" placeholder="Descreva o propósito deste estoque..."
            class="w-full border border-gray-200 bg-gray-50 focus:bg-white rounded-lg px-3 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-3 px-6 py-4 border-t border-gray-100">
        <button (click)="fecharFormulario()" class="px-4 py-2.5 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Cancelar</button>
        <button (click)="criarEstoque()" class="px-4 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">Criar Estoque</button>
      </div>
    </div>
  </div>

</app-layout>
