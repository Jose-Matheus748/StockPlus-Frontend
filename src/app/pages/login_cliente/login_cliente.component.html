<div class="min-h-screen flex items-center justify-center bg-gray-50 text-gray-900 px-4">

  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

    <!-- HEADER -->
    <div class="text-center mb-8">
      <img src="StockPluslogo.png" alt="StockPlus" class="w-16 h-16 mx-auto mb-4 object-contain">

      <div class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 text-xs font-medium px-3 py-1 rounded-full mb-3">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Área do Cliente
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Bem-vindo de volta</h1>
      <p class="text-sm text-gray-500 mt-1.5">Entre na sua conta para fazer pedidos</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="handleSubmit()" class="space-y-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          placeholder="Sua senha"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
      </div>

      <div *ngIf="erro" class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ erro }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700
               text-white font-medium text-sm py-2.5 rounded-lg transition-colors disabled:opacity-50">
        <svg *ngIf="isLoading" class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

    <!-- FOOTER -->
    <div class="mt-6 space-y-3 text-center text-sm text-gray-500">
      <p>
        Não tem conta?
        <a routerLink="/cadastro/cliente" class="text-blue-600 hover:text-blue-700 font-medium">Criar conta</a>
      </p>

      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">é uma loja?</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <p>
        <a routerLink="/login/loja" class="text-gray-500 hover:text-gray-700 font-medium">Entrar como Loja →</a>
      </p>
    </div>

  </div>
</div>
