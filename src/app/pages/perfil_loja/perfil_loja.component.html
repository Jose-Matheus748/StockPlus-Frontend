<app-layout>
 
  <app-alerta
    [mensagem]="alertMensagem"
    [tipo]="alertTipo"
    [visivel]="alertVisivel">
  </app-alerta>
 
  <div class="max-w-3xl mx-auto px-6 py-8">
 
    <!-- HEADER -->
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Perfil da Loja</h1>
      <p class="text-sm text-gray-500 mt-0.5">Gerencie as informações da sua loja</p>
    </div>
 
    <!-- LOADING -->
    <div *ngIf="isLoading" class="flex items-center justify-center gap-3 py-24 text-gray-400 text-sm">
      <svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      Carregando perfil...
    </div>
 
    <div *ngIf="!isLoading" class="flex flex-col gap-6">
 
      <!-- CARD AVATAR + NOME -->
      <div class="bg-white border border-gray-200 rounded-2xl p-6 flex items-center gap-5 shadow-lg">
        <div class="w-16 h-16 rounded-xl bg-amber-50 flex items-center justify-center flex-shrink-0">
          <span class="text-2xl font-bold text-amber-600">{{ getNomeInicial() }}</span>
        </div>
        <div>
          <h2 class="text-lg font-semibold text-gray-900">{{ formData.nome || '—' }}</h2>
          <p class="text-sm text-gray-400 mt-0.5">{{ formData.email }}</p>
          <span class="inline-flex items-center gap-1.5 mt-2 text-xs font-medium text-amber-700 bg-amber-50 px-2.5 py-1 rounded-full">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Loja
          </span>
        </div>
      </div>
 
      <!-- CARD DADOS -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-lg overflow-hidden">
 
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-800">Dados da loja</h3>
          <button
            *ngIf="!modoEdicao"
            (click)="ativarEdicao()"
            class="inline-flex items-center gap-1.5 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Editar
          </button>
        </div>
 
        <div class="px-6 py-5 flex flex-col gap-5">
 
          <!-- Nome -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-gray-700">Nome da loja</label>
            <input
              *ngIf="modoEdicao"
              type="text"
              [(ngModel)]="formData.nome"
              name="nome"
              placeholder="Nome da sua loja"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
            <p *ngIf="!modoEdicao" class="text-sm text-gray-900 py-2.5 px-3 bg-gray-50 rounded-lg">
              {{ formData.nome || '—' }}
            </p>
          </div>
 
          <!-- Email -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-gray-700">Email</label>
            <input
              *ngIf="modoEdicao"
              type="email"
              [(ngModel)]="formData.email"
              name="email"
              placeholder="loja@email.com"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
            <p *ngIf="!modoEdicao" class="text-sm text-gray-900 py-2.5 px-3 bg-gray-50 rounded-lg">
              {{ formData.email || '—' }}
            </p>
          </div>
 
          <!-- CNPJ (somente leitura) -->
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-gray-700">CNPJ</label>
            <p class="text-sm text-gray-900 py-2.5 px-3 bg-gray-50 rounded-lg flex items-center gap-2">
              {{ formData.cnpj || '—' }}
              <span class="text-xs text-gray-400">(não editável)</span>
            </p>
          </div>
 
        </div>
 
        <!-- AÇÕES DO CARD -->
        <div *ngIf="modoEdicao" class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
          <button
            (click)="cancelarEdicao()"
            class="px-4 py-2.5 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button
            (click)="salvarDados()"
            [disabled]="isSaving"
            class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm disabled:opacity-50">
            <svg *ngIf="isSaving" class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            {{ isSaving ? 'Salvando...' : 'Salvar alterações' }}
          </button>
        </div>
 
      </div>
 
      <!-- CARD SENHA -->
      <div class="bg-white border border-gray-200 rounded-2xl shadow-lg overflow-hidden">
 
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-gray-800">Alterar senha</h3>
          <button
            *ngIf="!modoSenha"
            (click)="ativarAlteracaoSenha()"
            class="inline-flex items-center gap-1.5 text-sm font-medium text-blue-600 hover:text-blue-700 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Alterar
          </button>
        </div>
 
        <!-- Estado inativo -->
        <div *ngIf="!modoSenha" class="px-6 py-5">
          <p class="text-sm text-gray-400">••••••••</p>
        </div>
 
        <!-- Estado ativo -->
        <div *ngIf="modoSenha" class="px-6 py-5 flex flex-col gap-5">
 
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-gray-700">Nova senha</label>
            <input
              type="password"
              [(ngModel)]="senhaData.novaSenha"
              name="novaSenha"
              placeholder="Crie uma nova senha"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
          </div>
 
          <div class="flex flex-col gap-1.5">
            <label class="text-sm font-medium text-gray-700">Confirmar nova senha</label>
            <input
              type="password"
              [(ngModel)]="senhaData.confirmarSenha"
              name="confirmarSenha"
              placeholder="Repita a nova senha"
              class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                     focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"/>
          </div>
 
        </div>
 
        <div *ngIf="modoSenha" class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
          <button
            (click)="cancelarSenha()"
            class="px-4 py-2.5 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">
            Cancelar
          </button>
          <button
            (click)="salvarSenha()"
            [disabled]="isSavingSenha"
            class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm disabled:opacity-50">
            <svg *ngIf="isSavingSenha" class="animate-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            {{ isSavingSenha ? 'Salvando...' : 'Salvar senha' }}
          </button>
        </div>
 
      </div>
 
    </div>
  </div>
 
</app-layout>
