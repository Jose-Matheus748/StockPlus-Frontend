<app-layout>

  <app-alerta
    [mensagem]="alertMensagem"
    [tipo]="alertTipo"
    [visivel]="alertVisivel">
  </app-alerta>

  <div class="max-w-6xl mx-auto px-4 py-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-semibold text-gray-800">Protocolos</h1>

      <button
        class="bg-amber-500 hover:bg-amber-700 text-white px-4 py-2 rounded-lg"
        (click)="abrirFormulario()">
        + Criar Protocolo
      </button>
    </div>

    <!-- LOADING -->
    <div *ngIf="isLoading" class="text-center py-10 text-gray-500">
      Carregando protocolos...
    </div>

    <!-- ERRO -->
    <div *ngIf="erro && !isLoading" class="bg-red-100 text-red-700 p-4 rounded mb-4">
      {{ erro }}
    </div>

    <!-- LISTA -->
    <div *ngIf="!isLoading && protocolos.length > 0"
         class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">

      <div *ngFor="let p of protocolos"
           class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm hover:shadow-md transition">

        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg text-gray-800">
            {{ p.nome }}
          </h3>

          <button
            class="bg-red-100 hover:bg-red-300 px-2 py-1 rounded"
            (click)="deletarProtocolo(p)">
            🗑️
          </button>
        </div>

        <p class="text-sm">
          <strong>Preço:</strong>
          R$ {{ p.preco | number:'1.2-2' }}
        </p>

        <p class="text-sm">
          <strong>Itens:</strong>
          {{ p.itens.length }}
        </p>

        <p class="text-sm">
          <strong>Total:</strong>
          R$ {{ p.valorTotal | number:'1.2-2' }}
        </p>

        <button
          class="mt-4 w-full bg-amber-500 hover:bg-amber-700 text-white py-2 rounded-lg"
          (click)="acessarProtocolo(p)">
          Abrir Protocolo
        </button>

      </div>
    </div>

    <!-- EMPTY STATE -->
    <div *ngIf="!isLoading && protocolos.length === 0"
         class="text-center py-16 text-gray-500">
      <p class="mb-4">Nenhum protocolo cadastrado.</p>

      <button
        class="bg-amber-500 hover:bg-amber-700 text-white px-4 py-2 rounded-lg"
        (click)="abrirFormulario()">
        Criar primeiro protocolo
      </button>
    </div>

  </div>

  <!-- MODAL -->
  <div *ngIf="showFormModal"
       class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
       (click)="fecharFormulario()">

    <div class="bg-white rounded-xl p-6 w-full max-w-md"
         (click)="$event.stopPropagation()">

      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Criar Protocolo</h3>

        <button class="text-gray-500 hover:text-black"
                (click)="fecharFormulario()">
          ✕
        </button>
      </div>

      <div class="space-y-4">

        <div>
          <label class="block text-sm font-medium mb-1">Nome *</label>
          <input
            type="text"
            class="w-full border rounded-lg px-3 py-2"
            [(ngModel)]="novoProtocolo.nome">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Preço</label>
          <input
            type="number"
            class="w-full border rounded-lg px-3 py-2"
            [(ngModel)]="novoProtocolo.preco">
        </div>

        <div class="flex justify-end gap-2 pt-4">
          <button
            class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg"
            (click)="fecharFormulario()">
            Cancelar
          </button>

          <button
            class="bg-amber-500 hover:bg-amber-700 text-white px-4 py-2 rounded-lg"
            (click)="criarProtocolo()">
            Criar
          </button>
        </div>

      </div>
    </div>
  </div>

</app-layout>
