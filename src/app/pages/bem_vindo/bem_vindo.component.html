<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12">

  <div class="w-full max-w-lg">

    <div class="text-center mb-10">
      <img
        src="StockPluslogo.png"
        alt="StockPlus"
        class="w-20 h-20 mx-auto mb-4 object-contain">

      <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">StockPlus</h1>
      <p class="text-sm text-gray-500 mt-1.5">Selecione seu perfil para continuar</p>
    </div>

    <div class="bg-white border-2 border-blue-500 rounded-2xl shadow-md p-6 mb-4">

      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center flex-shrink-0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold text-gray-900">Sou Cliente</h2>
          </div>
          <p class="text-xs text-gray-400 mt-0.5">Faça pedidos nas lojas parceiras</p>
        </div>
      </div>

      <p class="text-xs text-gray-500 mb-5 leading-relaxed">
        Acesse o catálogo de protocolos das lojas e realize seus pedidos com facilidade.
      </p>

      <div class="flex gap-3">
        <button
          (click)="loginCliente()"
          class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors">
          Entrar
        </button>
        <button
          (click)="cadastroCliente()"
          class="flex-1 py-2.5 bg-white hover:bg-blue-50 text-blue-600 text-sm font-medium rounded-lg border border-blue-200 hover:border-blue-300 transition-colors">
          Criar conta
        </button>
      </div>

    </div>

    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400">é uma loja?</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-5 flex items-center gap-4">

      <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center flex-shrink-0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </div>

      <div class="flex-1 min-w-0">
        <h2 class="text-sm font-medium text-gray-700">Tenho uma Loja</h2>
        <p class="text-xs text-gray-400">Gerencie estoques, protocolos e pedidos</p>
      </div>

      <div class="flex gap-2 flex-shrink-0">
        <button
          (click)="loginLoja()"
          class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded-lg transition-colors">
          Entrar
        </button>
        <button
          (click)="cadastroLoja()"
          class="px-3 py-2 bg-white hover:bg-gray-50 text-gray-600 text-xs font-medium rounded-lg border border-gray-200 hover:border-gray-300 transition-colors">
          Cadastrar
        </button>
      </div>

    </div>

    <p class="text-center text-xs text-gray-400 mt-8">
      Gerencie seu estoque com simplicidade e controle.
    </p>

  </div>

</div>
