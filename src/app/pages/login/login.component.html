<div class="min-h-screen flex items-center justify-center bg-gray-50 text-gray-900 px-4">

  <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold mb-4">
        S
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-gray-900">
        StockPlus
      </h1>

      <p class="text-sm text-gray-500 mt-2">
        Faça login para acessar o sistema
      </p>
    </div>

    <form (ngSubmit)="handleSubmit()" class="space-y-5">

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-700">Senha</label>
        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          placeholder="Sua senha"
          class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div *ngIf="erro"
           class="text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ erro }}
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700
               text-white font-medium text-sm py-2.5 rounded-lg transition-colors
               disabled:opacity-50">

        <svg *ngIf="isLoading" class="animate-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>

        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

    <div class="text-center mt-6 text-sm text-gray-500">
      <p>
        Não tem conta?
        <a routerLink="/cadastro/loja"
           class="text-blue-600 hover:text-blue-700 font-medium">
          Criar conta
        </a>
      </p>
    </div>

  </div>
</div>
