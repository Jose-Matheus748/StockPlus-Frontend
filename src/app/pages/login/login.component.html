<app-alerta
  [mensagem]="alertMensagem"
  [tipo]="alertTipo"
  [visivel]="alertVisivel">
</app-alerta>

<div class="min-h-screen flex items-center justify-center bg-[#050816] text-white">

  <div class="w-full max-w-md bg-slate-900 border border-cyan-500/20 rounded-2xl p-8 shadow-[0_0_30px_rgba(34,211,238,0.15)]">

    <!-- HEADER -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold font-orbitron">StockPlus</h1>
      <p class="text-gray-400 mt-2">Faça login para continuar</p>
    </div>

    <!-- FORM -->
    <form (ngSubmit)="handleSubmit()" class="space-y-5">

      <!-- EMAIL -->
      <div>
        <label class="block text-sm text-gray-400 mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600
                 focus:ring-2 focus:ring-cyan-500 outline-none"
          placeholder="seu@email.com"
        />
      </div>

      <!-- SENHA -->
      <div>
        <label class="block text-sm text-gray-400 mb-1">Senha</label>
        <input
          type="password"
          [(ngModel)]="senha"
          name="senha"
          class="w-full p-3 rounded-lg bg-slate-800 border border-slate-600
                 focus:ring-2 focus:ring-cyan-500 outline-none"
          placeholder="Sua senha"
        />
      </div>

      <!-- ERRO -->
      <div *ngIf="erro" class="text-red-400 text-sm">
        {{ erro }}
      </div>

      <!-- BOTÃO -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-600
               font-bold transition-all duration-300
               shadow-lg shadow-cyan-500/30 disabled:opacity-50"
      >
        {{ isLoading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <!-- FOOTER -->
    <div class="text-center mt-6 text-gray-400">
      <p>
        Não tem conta?
        <a routerLink="/cadastro/loja" class="text-cyan-400 hover:underline">
          Cadastre-se
        </a>
      </p>
    </div>

  </div>
</div>
